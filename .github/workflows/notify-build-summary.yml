name: AethrOps Build Summary Notification

on:
    workflow_call:
      inputs:
        android_status:
          required: false
          type: string
          default: 'skipped'
        windows_status:
          required: false
          type: string
          default: 'skipped'
        linux_status:
          required: false
          type: string
          default: 'skipped'
        msix_status:
          required: false
          type: string
          default: 'skipped'

jobs:
    build_summary_notification:
      name: Send CI Summary
      runs-on: ubuntu-latest
      if: always()
      steps:
        - name: Send Telegram summary
          shell: bash
          run: |
            WINDOWS="${{ inputs.windows_status }}"
            ANDROID="${{ inputs.android_status }}"
            LINUX="${{ inputs.linux_status }}"
            MSIX="${{ inputs.msix_status }}"

            MESSAGE="<b>CI Build Summary</b>

            Windows: ${WINDOWS}
            Windows MSIX: ${MSIX}
            Android: ${ANDROID}
            Linux: ${LINUX}

            <a href=\"https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\">View CI Run</a>"

            curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d parse_mode=HTML \
            -d disable_web_page_preview=true \
            --data-urlencode text="$MESSAGE"