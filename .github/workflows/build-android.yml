name: AethrOps Android Build

on:
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: oracle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d

      - name: Restore keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode \
            > awsmgr_ui/android/app/upload-keystore.jks

      - name: Restore key.properties
        run: echo "${{ secrets.KEY_PROPERTIES }}" > awsmgr_ui/android/key.properties

      - name: Build Go Backend (FFI)
        run: |
          set -e
          cd backend_ffi

          ARCHS=("arm64-v8a" "armeabi-v7a" "x86_64")

          for arch in "${ARCHS[@]}"; do
            unset GOARM

            if [ "$arch" = "arm64-v8a" ]; then
              GOARCH=arm64
              CC=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang
            elif [ "$arch" = "armeabi-v7a" ]; then
              GOARCH=arm
              GOARM=7
              CC=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi21-clang
            else
              GOARCH=amd64
              CC=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android21-clang
            fi

            CGO_ENABLED=1 GOOS=android GOARCH=$GOARCH GOARM=${GOARM:-} CC=$CC \
              go build -buildmode=c-shared -o libbackend_$arch.so main.go
          done

      - name: Copy native libraries
        run: |
          for arch in arm64-v8a armeabi-v7a x86_64; do
            mkdir -p awsmgr_ui/android/app/src/main/jniLibs/$arch
            mv backend_ffi/libbackend_$arch.so \
              awsmgr_ui/android/app/src/main/jniLibs/$arch/libbackend.so
          done

      - name: Accept Android licenses
        run: yes | flutter doctor --android-licenses

      - name: Build signed APKs
        working-directory: awsmgr_ui
        run: |
          flutter clean
          flutter pub get
          flutter build apk --split-per-abi --release

      - name: Ensure jq is installed
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Prepare release artifacts
        run: |
          set -e

          # Read version from version.json and normalize (lowercase + spaces to dashes)
          VERSION=$(jq -r '.android.version' "$GITHUB_WORKSPACE/version.json" | tr '[:upper:]' '[:lower:]' | tr ' ' '-')

          RELEASE_DIR="$GITHUB_WORKSPACE/release/android"
          APK_DIR="$GITHUB_WORKSPACE/awsmgr_ui/build/app/outputs/flutter-apk"

          mkdir -p "$RELEASE_DIR"

          cp "$APK_DIR/app-arm64-v8a-release.apk" \
            "$RELEASE_DIR/AethrOps-${VERSION}-arm64-v8a.apk"

          cp "$APK_DIR/app-armeabi-v7a-release.apk" \
            "$RELEASE_DIR/AethrOps-${VERSION}-armeabi-v7a.apk"

          cp "$APK_DIR/app-x86_64-release.apk" \
            "$RELEASE_DIR/AethrOps-${VERSION}-x86_64.apk"

          cd "$RELEASE_DIR"
          sha256sum *.apk > checksums-sha256.txt

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: AethrOps-android-release
          path: release/android/
