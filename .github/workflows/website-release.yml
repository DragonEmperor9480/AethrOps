name: AethrOps Website Update

on:
    workflow_call:
jobs:
    Website_Update:
      name: Update Version in Website
      runs-on: ubuntu-latest

      steps:
        - name: Checkout repository
          uses: actions/checkout@v4

        - name: Ensure jq is installed
          run: sudo apt-get update && sudo apt-get install -y jq

        - name: Read release versions
          id: version
          shell: bash
          run: |
            # Read website version for display
            VERSION=$(jq -r '.website.version' version.json | xargs)
            if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
              echo "❌ website.version is empty. Aborting."
              exit 1
            fi

            # Derive release tag from website version (normalize: lowercase + spaces to hyphens)
            RELEASE_TAG=$(echo "$VERSION" | tr '[:upper:]' '[:lower:]' | tr ' ' '-')

            # Read platform-specific versions
            ANDROID_VERSION=$(jq -r '.android.version' version.json | xargs)
            LINUX_VERSION=$(jq -r '.linux.version' version.json | xargs)
            WINDOWS_VERSION=$(jq -r '.windows.version' version.json | xargs)

            echo "Website version: $VERSION"
            echo "Release tag: $RELEASE_TAG"
            echo "Android version: $ANDROID_VERSION"
            echo "Linux version: $LINUX_VERSION"
            echo "Windows version: $WINDOWS_VERSION"

            echo "RELEASE_VERSION=$VERSION" >> $GITHUB_ENV
            echo "RELEASE_TAG=$RELEASE_TAG" >> $GITHUB_ENV
            echo "ANDROID_VERSION=$ANDROID_VERSION" >> $GITHUB_ENV
            echo "LINUX_VERSION=$LINUX_VERSION" >> $GITHUB_ENV
            echo "WINDOWS_VERSION=$WINDOWS_VERSION" >> $GITHUB_ENV

        - name: Clone website repository
          run: |
            git clone https://x-access-token:${{ secrets.WEBSITE_REPO_TOKEN }}@github.com/DragonEmperor9480/terminal-aws-commander.git

        - name: Verify website version.json
          run: |
            cat terminal-aws-commander/src/data/version.json | jq .

        - name: Create new release JSON
          shell: bash
          run: |
            RELEASE_DATE=$(date +%Y-%m-%d)

            jq -n \
              --arg version "$RELEASE_VERSION" \
              --arg tag "$RELEASE_TAG" \
              --arg date "$RELEASE_DATE" \
              --arg android_ver "$ANDROID_VERSION" \
              --arg linux_ver "$LINUX_VERSION" \
              --arg windows_ver "$WINDOWS_VERSION" \
              '{
                version: $version,
                releaseDate: $date,
                releaseNotes: ("https://github.com/DragonEmperor9480/AethrOps/releases/tag/" + $tag),
                platforms: {
                  android: {
                    version: $android_ver,
                    status: "available",
                    downloadUrl: ("https://github.com/DragonEmperor9480/AethrOps/releases/tag/" + $tag),
                    files: [
                      {
                        name: "ARM64 (Modern phones)",
                        url: ("https://github.com/DragonEmperor9480/AethrOps/releases/download/" + $tag + "/AethrOps-" + $tag + "-arm64-v8a.apk")
                      },
                      {
                        name: "ARM32 (Older phones)",
                        url: ("https://github.com/DragonEmperor9480/AethrOps/releases/download/" + $tag + "/AethrOps-" + $tag + "-armeabi-v7a.apk")
                      },
                      {
                        name: "x86_64 (Emulators)",
                        url: ("https://github.com/DragonEmperor9480/AethrOps/releases/download/" + $tag + "/AethrOps-" + $tag + "-x86_64.apk")
                      }
                    ]
                  },
                  linux: {
                    version: $linux_ver,
                    status: "available",
                    downloadUrl: ("https://github.com/DragonEmperor9480/AethrOps/releases/tag/" + $tag),
                    files: [
                      {
                        name: "AppImage",
                        url: ("https://github.com/DragonEmperor9480/AethrOps/releases/download/" + $tag + "/AethrOps-" + $tag + "-x86_64.AppImage")
                      },
                      {
                        name: "DEB",
                        url: ("https://github.com/DragonEmperor9480/AethrOps/releases/download/" + $tag + "/AethrOps_0.0.0-" + $tag + "_amd64.deb")
                      }
                    ]
                  },
                  windows: {
                    version: $windows_ver,
                    status: "available",
                    downloadUrl: ("https://github.com/DragonEmperor9480/AethrOps/releases/download/" + $tag + "/AethrOps-setup-" + $tag + ".exe"),
                    files: [
                      {
                        name: "Installer (.exe)",
                        url: ("https://github.com/DragonEmperor9480/AethrOps/releases/download/" + $tag + "/AethrOps-setup-" + $tag + ".exe")
                      }
                    ]
                  },
                  macos: {
                    version: $version,
                    status: "coming-soon",
                    downloadUrl: null,
                    files: []
                  }
                }
              }' > new_release.json

        - name: Append release to website version.json
          run: |
            cd terminal-aws-commander/src/data
            jq '. |= [input] + .' version.json ../../../new_release.json > tmp.json
            mv tmp.json version.json

        - name: Commit and push website update
          run: |
            cd terminal-aws-commander

            git config user.name "DragonEmperor9480"
            git config user.email "amruteshnaregal1234@gmail.com"

            git add src/data/version.json
            git commit -m "github-actions: chore: add $RELEASE_VERSION release"
            git push