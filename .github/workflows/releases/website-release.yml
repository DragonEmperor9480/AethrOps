jobs:
    Website_Update:
      name: Update Version in Website
      runs-on: ubuntu-latest
      needs: release
      if: success()

      steps:
        - name: Checkout repository
          uses: actions/checkout@v4

        - name: Ensure jq is installed
          run: sudo apt-get update && sudo apt-get install -y jq

        - name: Read release version
          id: version
          shell: bash
          run: |
            VERSION=$(jq -r '.website.version' version.json | xargs)

            if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
              echo "❌ website.version is empty. Aborting."
              exit 1
            fi

              echo "Release version: $VERSION"

              # Normalize for tags (Preview Beta 2 → preview-beta-2)
              TAG=$(echo "$VERSION" | tr '[:upper:]' '[:lower:]' | tr ' ' '-')

              echo "RELEASE_VERSION=$VERSION" >> $GITHUB_ENV
              echo "RELEASE_TAG=$TAG" >> $GITHUB_ENV

        - name: Clone website repository
          run: |
            git clone https://x-access-token:${{ secrets.WEBSITE_REPO_TOKEN }}@github.com/DragonEmperor9480/terminal-aws-commander.git

        - name: Verify website version.json
          run: |
            cat terminal-aws-commander/src/data/version.json | jq .

        - name: Create new release JSON
          shell: bash
          run: |
            RELEASE_DATE=$(date +%Y-%m-%d)

            jq -n \
              --arg version "$RELEASE_VERSION" \
              --arg tag "$RELEASE_TAG" \
              --arg date "$RELEASE_DATE" \
              '{
                version: $version,
                releaseDate: $date,
                releaseNotes: ("https://github.com/DragonEmperor9480/AetherOps/releases/tag/" + $tag),
                platforms: {
                  android: {
                    version: $version,
                    status: "available",
                    downloadUrl: ("https://github.com/DragonEmperor9480/AetherOps/releases/tag/" + $tag),
                    files: [
                      {
                        name: "ARM64 (Modern phones)",
                        url: ("https://github.com/DragonEmperor9480/AetherOps/releases/download/" + $tag + "/aws-manager-" + $tag + "-arm64-v8a.apk")
                      },
                      {
                        name: "ARM32 (Older phones)",
                        url: ("https://github.com/DragonEmperor9480/AetherOps/releases/download/" + $tag + "/aws-manager-" + $tag + "-armeabi-v7a.apk")
                      },
                      {
                        name: "x86_64 (Emulators)",
                        url: ("https://github.com/DragonEmperor9480/AetherOps/releases/download/" + $tag + "/aws-manager-" + $tag + "-x86_64.apk")
                      }
                    ]
                  },
                  linux: {
                    version: $version,
                    status: "available",
                    downloadUrl: ("https://github.com/DragonEmperor9480/AetherOps/releases/tag/" + $tag),
                    files: [
                      {
                        name: "AppImage",
                        url: ("https://github.com/DragonEmperor9480/AetherOps/releases/download/" + $tag + "/aws-manager-" + $version + "-x86_64.AppImage")
                      },
                      {
                        name: "DEB",
                        url: ("https://github.com/DragonEmperor9480/AetherOps/releases/download/" + $tag + "/aws-manager_0.0.0-" + ($version | gsub(" "; "-")) + "_amd64.deb")
                      }
                    ]
                  },
                  windows: {
                    version: $version,
                    status: "available",
                    downloadUrl: ("https://github.com/DragonEmperor9480/AetherOps/releases/download/" + $tag + "/aws-manager-setup-" + $version + ".exe"),
                    files: [
                      {
                        name: "Installer (.exe)",
                        url: ("https://github.com/DragonEmperor9480/AetherOps/releases/download/" + $tag + "/aws-manager-setup-" + $version + ".exe")
                      }
                    ]
                  },
                  macos: {
                    version: $version,
                    status: "coming-soon",
                    downloadUrl: null,
                    files: []
                  }
                }
              }' > new_release.json

        - name: Append release to website version.json
          run: |
            cd terminal-aws-commander/src/data
            jq '. |= [input] + .' version.json ../../../new_release.json > tmp.json
            mv tmp.json version.json

        - name: Commit and push website update
          run: |
            cd terminal-aws-commander

            git config user.name "DragonEmperor9480"
            git config user.email "amruteshnaregal1234@gmail.com"

            git add src/data/version.json
            git commit -m "github-actions: chore: add $RELEASE_VERSION release"
            git push