name: "Flutter Multi-Platform Build"

on:
    push:
        branches:
            - github-actions


jobs:
    windows:
        name: Flutter Windows Build
        runs-on: windows-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4
            
            - name: Setup Java
              uses: actions/setup-java@v4
              with:
                java-version: '17'
                distribution: 'oracle'
            - name: Setup Flutter
              uses: subosito/flutter-action@v2
              with:
                channel: 'stable'
            
            - name: Enable Windows Desktop
              run: flutter config --enable-windows-desktop

            - name: Install Dependencies
              working-directory: awsmgr_ui
              run: flutter pub get

            - name: Build Windows App
              working-directory: awsmgr_ui
              run: flutter build windows --release

            - name: Upload Windows Build
              uses: actions/upload-artifact@v4
              with:
                name: aws_manager-windows-build
                path: awsmgr_ui/build/windows/x64/runner/Release/


            - name: Notify Telegram (Success)
              if: success()
              run: |
                MESSAGE="*Build Success for Windows*

                *Project:* [${{ github.repository }}](https://github.com/${{ github.repository }})
                *Branch:* \`${{ github.ref_name }}\`
                *Platform:* Windows
                *Status:* SUCCESS

                [View CI Run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})"

                curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
                -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
                -d parse_mode=MarkdownV2 \
                -d disable_web_page_preview=true \
                --data-urlencode text="$MESSAGE"

            - name: Notify Telegram (Failure)
              if: failure()
              shell: bash
              run: |
                MESSAGE="GitHub Actions Build FAILED for Windows
                Repo: ${{ github.repository }}
                Branch: ${{ github.ref_name }}
                Job: FAILURE
                Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

                curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
                -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
                --data-urlencode text="$MESSAGE"

    
    android:
        name: Flutter Android Build
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Java
              uses: actions/setup-java@v4
              with:
                java-version: '17'
                distribution: 'oracle'

            - name: Setup Flutter
              uses: subosito/flutter-action@v2
              with:
                channel: 'stable'

            - name: Set up Go
              uses: actions/setup-go@v5
              with:
                go-version: '1.22'

            - name: Install Android NDK
              uses: nttld/setup-ndk@v1
              with:
                ndk-version: 'r26d'
            
            - name: Restore keystore
              run: |
                echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > awsmgr_ui/android/app/upload-keystore.jks

            - name: Restore key.properties
              run: |
                echo "${{ secrets.KEY_PROPERTIES }}" > awsmgr_ui/android/key.properties

            - name: Build Go Backend(FFI)
              run: |
                  set -e
                  cd backend_ffi

                  ARCHS=("arm64-v8a" "armeabi-v7a" "x86_64")

                  for arch in "${ARCHS[@]}"; do
                    if [ "$arch" = "arm64-v8a" ]; then
                      GOARCH=arm64
                      CC=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang
                    elif [ "$arch" = "armeabi-v7a" ]; then
                      GOARCH=arm
                      GOARM=7
                      CC=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi21-clang
                    else
                      GOARCH=amd64
                      CC=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android21-clang
                    fi

                    CGO_ENABLED=1 GOOS=android GOARCH=$GOARCH GOARM=${GOARM:-} CC=$CC \
                      go build -buildmode=c-shared -o libbackend_$arch.so main.go
                  done
            
            - name: Copy native libraries
              run: |
                for arch in arm64-v8a armeabi-v7a x86_64; do
                  mkdir -p awsmgr_ui/android/app/src/main/jniLibs/$arch
                  mv backend_ffi/libbackend_$arch.so \
                     awsmgr_ui/android/app/src/main/jniLibs/$arch/libbackend.so
                done

            - name: Accept Android licenses
              run: yes | flutter doctor --android-licenses

            - name: Build signed APKs
              working-directory: awsmgr_ui
              run: |
                flutter clean
                flutter pub get
                flutter build apk --split-per-abi --release

            - name: Prepare release artifacts
              run: |
                set -e

                RELEASE_DIR="$GITHUB_WORKSPACE/release/android"
                APK_DIR="$GITHUB_WORKSPACE/awsmgr_ui/build/app/outputs/flutter-apk"

                mkdir -p "$RELEASE_DIR"

                cp "$APK_DIR/app-arm64-v8a-release.apk" \
                   "$RELEASE_DIR/aws-manager-preview-beta-1-arm64-v8a.apk"

                cp "$APK_DIR/app-armeabi-v7a-release.apk" \
                   "$RELEASE_DIR/aws-manager-preview-beta-1-armeabi-v7a.apk"

                cp "$APK_DIR/app-x86_64-release.apk" \
                   "$RELEASE_DIR/aws-manager-preview-beta-1-x86_64.apk"

                cd "$RELEASE_DIR"
                sha256sum *.apk > checksums-sha256.txt


            - name: Upload APKs
              uses: actions/upload-artifact@v4
              with:
                name: aws-manager-android-release
                path: release/android/
            
            - name: Notify Telegram (Success)
              if: success()
              run: |
                MESSAGE="*Build Success for Android*

                *Project:* [${{ github.repository }}](https://github.com/${{ github.repository }})
                *Branch:* \`${{ github.ref_name }}\`
                *Platform:* Android
                *Status:* SUCCESS

                [View CI Run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})"

                curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
                -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
                -d parse_mode=MarkdownV2 \
                -d disable_web_page_preview=true \
                --data-urlencode text="$MESSAGE"
                
            - name: Notify Telegram (Failure)
              if: failure()
              run: |
                MESSAGE="GitHub Actions Build FAILED for Android
                Repo: ${{ github.repository }}
                Branch: ${{ github.ref_name }}
                Job: FAILURE
                Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

                curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
                -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
                --data-urlencode text="$MESSAGE"

    linux:
        name: Flutter Linux Build
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Java
              uses: actions/setup-java@v4
              with:
                java-version: '17'
                distribution: 'oracle'

            - name: Setup Flutter
              uses: subosito/flutter-action@v2
              with:
                channel: 'stable'
    
            - run: flutter config --enable-linux-desktop
            
            - name: Install Linux dependencies
              run: |
                sudo apt-get update
                sudo apt-get install -y \
                  clang \
                  cmake \
                  ninja-build \
                  pkg-config \
                  libgtk-3-dev \
                  libblkid-dev \
                  liblzma-dev \
                  libjsoncpp-dev \
                  libsecret-1-dev


            - name: Install Dependencies
              working-directory: awsmgr_ui
              run: flutter pub get

            - name: Build Linux App
              working-directory: awsmgr_ui
              run: flutter build linux --release


            - name: Upload Linux Build
              uses: actions/upload-artifact@v4
              with:
                name: aws_manager-linux-build
                path: awsmgr_ui/build/linux/x64/release/bundle/

            - name: Notify Telegram (Success)
              if: success()
              run: |
                MESSAGE="*Build Success for Linux*

                *Project:* [${{ github.repository }}](https://github.com/${{ github.repository }})
                *Branch:* \`${{ github.ref_name }}\`
                *Platform:* Linux
                *Status:* SUCCESS

                [View CI Run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})"

                curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
                -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
                -d parse_mode=MarkdownV2 \
                -d disable_web_page_preview=true \
                --data-urlencode text="$MESSAGE"

            - name: Notify Telegram (Failure)
              if: failure()
              run: |
                MESSAGE="GitHub Actions Build FAILED for Linux
                Repo: ${{ github.repository }}
                Branch: ${{ github.ref_name }}
                Job: FAILURE
                Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

                curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
                -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
                --data-urlencode text="$MESSAGE"


