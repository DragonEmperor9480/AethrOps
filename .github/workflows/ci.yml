name: "Test Build for windows"
on:
    push:
        branches:
            - github-actions

jobs:
    build:
        name: Flutter Windows Build
        runs-on: windows-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4
            - name: Set up Java
              uses: actions/setup-java@v4
              with:
                java-version: '17'
                distribution: 'oracle'
            - name: Set up Flutter
              uses: subosito/flutter-action@v2
              with:
                channel: 'stable'            
            - name: Enable Windows Desktop
              run: flutter config --enable-windows-desktop
            - name: Install Dependencies
              working-directory: awsmgr_ui
              run: flutter pub get
            - name: Build App
              working-directory: awsmgr_ui
              run: flutter build windows
            - name: Upload Windows Build
              uses: actions/upload-artifact@v4
              with:
                name: awsmgr-windows-build
                path: awsmgr_ui/build/windows/x64/runner/Release/
            

            


