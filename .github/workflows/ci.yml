name: "Flutter Multi-Platform Build"

permissions:
  contents: write

on:
    push:
        branches:
            - github-actions


jobs:
    
    Build_initiation_notification:
      name: Build Start notification
      runs-on: ubuntu-latest
      steps:
        - name: Send Telegram summary
          shell: bash
          run: |
                START_TIME="$(date -u +"%Y-%m-%d %H:%M:%S UTC")"
                SHORT_SHA="$(echo ${{ github.sha }} | cut -c1-7)"

                MESSAGE="<b>🚀 CI Build Started</b>

                  <b>Project:</b> <a href=\"https://github.com/${{ github.repository }}\">${{ github.repository }}</a>
                <b>Branch:</b> <code>${{ github.ref_name }}</code>
                <b>Commit:</b> <code>${SHORT_SHA}</code>
                <b>Triggered by:</b> ${{ github.actor }}
                <b>Event:</b> ${{ github.event_name }}

                <b>Platforms:</b> Windows • Android • Linux

                <b>Started at:</b> ${START_TIME}

                🔗 <a href=\"https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\">View CI Run</a>"

                curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
                  -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
                  -d parse_mode=HTML \
                  -d disable_web_page_preview=true \
                  --data-urlencode text="$MESSAGE"
  
    windows:
        name: Flutter Windows Build
        runs-on: windows-latest
        needs: Build_initiation_notification
        if: success()

        steps:
            - name: Checkout
              uses: actions/checkout@v4
            
            - name: Setup Java
              uses: actions/setup-java@v4
              with:
                java-version: '17'
                distribution: 'oracle'
            - name: Setup Flutter
              uses: subosito/flutter-action@v2
              with:
                channel: 'stable'
            
            - name: Enable Windows Desktop
              run: flutter config --enable-windows-desktop

            - name: Install Inno Setup
              shell: pwsh
              run: |
                choco install innosetup --yes --no-progress

            - name: Start Building 
              shell: cmd
              run: |
                call scripts\build_windows.bat

            - name: Upload Windows Build
              uses: actions/upload-artifact@v4
              with:
                name: aws_manager-windows-build
                path: release/windows/
    
    android:
        name: Flutter Android Build
        runs-on: ubuntu-latest
        needs: Build_initiation_notification
        if: success()

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Java
              uses: actions/setup-java@v4
              with:
                java-version: '17'
                distribution: 'oracle'

            - name: Setup Flutter
              uses: subosito/flutter-action@v2
              with:
                channel: 'stable'

            - name: Set up Go
              uses: actions/setup-go@v5
              with:
                go-version: '1.22'

            - name: Install Android NDK
              uses: nttld/setup-ndk@v1
              with:
                ndk-version: 'r26d'
            
            - name: Restore keystore
              run: |
                echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > awsmgr_ui/android/app/upload-keystore.jks

            - name: Restore key.properties
              run: |
                echo "${{ secrets.KEY_PROPERTIES }}" > awsmgr_ui/android/key.properties

            - name: Build Go Backend(FFI)
              run: |
                  set -e
                  cd backend_ffi

                  ARCHS=("arm64-v8a" "armeabi-v7a" "x86_64")

                  for arch in "${ARCHS[@]}"; do
                    if [ "$arch" = "arm64-v8a" ]; then
                      GOARCH=arm64
                      CC=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang
                    elif [ "$arch" = "armeabi-v7a" ]; then
                      GOARCH=arm
                      GOARM=7
                      CC=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi21-clang
                    else
                      GOARCH=amd64
                      CC=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android21-clang
                    fi

                    CGO_ENABLED=1 GOOS=android GOARCH=$GOARCH GOARM=${GOARM:-} CC=$CC \
                      go build -buildmode=c-shared -o libbackend_$arch.so main.go
                  done
            
            - name: Copy native libraries
              run: |
                for arch in arm64-v8a armeabi-v7a x86_64; do
                  mkdir -p awsmgr_ui/android/app/src/main/jniLibs/$arch
                  mv backend_ffi/libbackend_$arch.so \
                     awsmgr_ui/android/app/src/main/jniLibs/$arch/libbackend.so
                done

            - name: Accept Android licenses
              run: yes | flutter doctor --android-licenses

            - name: Build signed APKs
              working-directory: awsmgr_ui
              run: |
                flutter clean
                flutter pub get
                flutter build apk --split-per-abi --release

            - name: Prepare release artifacts
              run: |
                set -e

                RELEASE_DIR="$GITHUB_WORKSPACE/release/android"
                APK_DIR="$GITHUB_WORKSPACE/awsmgr_ui/build/app/outputs/flutter-apk"

                mkdir -p "$RELEASE_DIR"

                cp "$APK_DIR/app-arm64-v8a-release.apk" \
                   "$RELEASE_DIR/aws-manager-preview-beta-1-arm64-v8a.apk"

                cp "$APK_DIR/app-armeabi-v7a-release.apk" \
                   "$RELEASE_DIR/aws-manager-preview-beta-1-armeabi-v7a.apk"

                cp "$APK_DIR/app-x86_64-release.apk" \
                   "$RELEASE_DIR/aws-manager-preview-beta-1-x86_64.apk"

                cd "$RELEASE_DIR"
                sha256sum *.apk > checksums-sha256.txt


            - name: Upload APKs
              uses: actions/upload-artifact@v4
              with:
                name: aws-manager-android-release
                path: release/android/

    linux:
      name: Flutter Linux AppImage Build Test
      runs-on: ubuntu-latest
      needs: Build_initiation_notification
      if: success()

      env:
        APP_NAME: aws-manager
        VERSION: preview-beta-1

      steps:
        - uses: actions/checkout@v4

        - uses: actions/setup-java@v4
          with:
            java-version: '17'
            distribution: 'oracle'

        - uses: subosito/flutter-action@v2
          with:
            channel: stable

        - uses: actions/setup-go@v5
          with:
            go-version: '1.22'

        - name: Enable Linux desktop
          run: flutter config --enable-linux-desktop

        - name: Install system dependencies
          run: |
            sudo apt-get update
            sudo apt-get install -y \
              clang cmake ninja-build pkg-config \
              libgtk-3-dev libblkid-dev liblzma-dev \
              libjsoncpp-dev libsecret-1-dev \
              wget

        - name: Build backend
          run: |
            cd backend
            GOOS=linux GOARCH=amd64 go build -o awsmgr_backend main.go

        - name: Build Flutter Linux app
          working-directory: awsmgr_ui
          run: |
            flutter pub get
            flutter build linux --release

        - name: Prepare AppDir
          run: |
            set -e

            PROJECT_ROOT="$GITHUB_WORKSPACE"
            APPDIR="$PROJECT_ROOT/build/appimage/aws-manager.AppDir"
            RELEASE_DIR="$PROJECT_ROOT/release/linux"

            rm -rf "$PROJECT_ROOT/build/appimage"
            mkdir -p "$APPDIR" "$RELEASE_DIR"

            cp -r awsmgr_ui/build/linux/x64/release/bundle/* "$APPDIR/"
            cp backend/awsmgr_backend "$APPDIR/"
            chmod +x "$APPDIR/awsmgr_backend"
            mv "$APPDIR/awsmgr" "$APPDIR/aws-manager"

        - name: Create AppRun
          run: |
            cat > build/appimage/aws-manager.AppDir/AppRun << 'EOF'
            #!/bin/bash
            APPDIR="$(dirname "$(readlink -f "$0")")"
            export LD_LIBRARY_PATH="$APPDIR/lib:$LD_LIBRARY_PATH"
            cd "$APPDIR"
            ./awsmgr_backend &
            exec "$APPDIR/aws-manager" "$@"
            EOF
            chmod +x build/appimage/aws-manager.AppDir/AppRun

        - name: Create desktop file
          run: |
            cat > build/appimage/aws-manager.AppDir/awsmgr.desktop << EOF
            [Desktop Entry]
            Name=AWS Manager
            Exec=aws-manager
            Icon=aws-manager
            Type=Application
            Categories=Development;
            EOF
            chmod +x build/appimage/aws-manager.AppDir/awsmgr.desktop

        - name: Setup icon
          run: |
            cp awsmgr_ui/linux/icon.png build/appimage/aws-manager.AppDir/aws-manager.png
            ln -sf aws-manager.png build/appimage/aws-manager.AppDir/.DirIcon

        - name: Download appimagetool
          run: |
            mkdir -p build/appimage
            wget -q -O build/appimage/appimagetool.AppImage \
              https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
            chmod +x build/appimage/appimagetool.AppImage

        - name: Build AppImage
          run: |
            cd build/appimage
            export ARCH=x86_64
            ./appimagetool.AppImage \
              --appimage-extract-and-run \
              aws-manager.AppDir \
              aws-manager-${VERSION}-x86_64.AppImage

            mv aws-manager-${VERSION}-x86_64.AppImage \
               "$GITHUB_WORKSPACE/release/linux/"

        - name: Upload AppImage
          uses: actions/upload-artifact@v4
          with:
            name: aws-manager-linux-appimage
            path: release/linux/*.AppImage

    
    build_summary_notification:
      name: Send CI Summary
      runs-on: ubuntu-latest
      needs: [android, linux, windows]
      if: always()
      steps:
        - name: Send Telegram summary
          shell: bash
          run: |
            WINDOWS="${{ needs.windows.result }}"
            ANDROID="${{ needs.android.result }}"
            LINUX="${{ needs.linux.result }}"

            MESSAGE="<b>CI Build Summary</b>

            Windows: ${WINDOWS}
            Android: ${ANDROID}
            Linux: ${LINUX}

            <a href=\"https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\">View CI Run</a>"

            curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d parse_mode=HTML \
            -d disable_web_page_preview=true \
            --data-urlencode text="$MESSAGE"

      
    release: 
      name: Github Release
      runs-on: ubuntu-latest
      needs: build_summary_notification
      if: success()

      env:
        RELEASE_TAG: CI-TEST
        RELEASE_NAME: "AWS Manager CI Test"

      steps:
        - name: Checkout repository
          uses: actions/checkout@v4

        - name: Download Android Artifacts
          uses: actions/download-artifact@v4
          with:
            name: aws-manager-android-release
            path: release/android
          
        - name: Download Windows Artifacts
          uses: actions/download-artifact@v4
          with:
            name: aws_manager-windows-build
            path: release/windows
        
        - name: Download Linux Artifacts
          uses: actions/download-artifact@v4
          with:
            name: aws-manager-linux-appimage
            path: release/linux
          
        - name: Create GitHub Release
          uses: softprops/action-gh-release@v2
          with:
            tag_name: ${{ env.RELEASE_TAG }}
            name: ${{ env.RELEASE_NAME }}
            body_path: RELEASE_NOTES.md
            files: |
              release/android/*.apk
              release/windows/*.exe
              release/linux/*.AppImage
              
    Website_Update:
      name: Update Version in Website
      runs-on: ubuntu-latest
      needs: release
      if: success()

      steps:
        - name: Checkout repository
          uses: actions/checkout@v4

        - name: Ensure jq is installed
          run: sudo apt-get update && sudo apt-get install -y jq

        - name: Read release version
          id: version
          shell: bash
          run: |
            VERSION=$(jq -r '.website.version' version.json | xargs)

            if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
              echo "❌ website.version is empty. Aborting."
              exit 1
            fi

              echo "Release version: $VERSION"

              # Normalize for tags (Preview Beta 2 → preview-beta-2)
              TAG=$(echo "$VERSION" | tr '[:upper:]' '[:lower:]' | tr ' ' '-')

              echo "RELEASE_VERSION=$VERSION" >> $GITHUB_ENV
              echo "RELEASE_TAG=$TAG" >> $GITHUB_ENV

        - name: Clone website repository
          run: |
            git clone https://x-access-token:${{ secrets.WEBSITE_REPO_TOKEN }}@github.com/DragonEmperor9480/terminal-aws-commander.git

        - name: Verify website version.json
          run: |
            cat terminal-aws-commander/src/data/version.json | jq .

        - name: Create new release JSON
          shell: bash
          run: |
            RELEASE_DATE=$(date +%Y-%m-%d)

            jq -n \
              --arg version "$RELEASE_VERSION" \
              --arg tag "$RELEASE_TAG" \
              --arg date "$RELEASE_DATE" \
              '{
                version: $version,
                releaseDate: $date,
                releaseNotes: ("https://github.com/DragonEmperor9480/aws-manager/releases/tag/" + $tag),
                platforms: {
                  android: {
                    version: $version,
                    status: "available",
                    downloadUrl: ("https://github.com/DragonEmperor9480/aws-manager/releases/tag/" + $tag),
                    files: [
                      {
                        name: "ARM64 (Modern phones)",
                        url: ("https://github.com/DragonEmperor9480/aws-manager/releases/download/" + $tag + "/aws-manager-" + $tag + "-arm64-v8a.apk")
                      },
                      {
                        name: "ARM32 (Older phones)",
                        url: ("https://github.com/DragonEmperor9480/aws-manager/releases/download/" + $tag + "/aws-manager-" + $tag + "-armeabi-v7a.apk")
                      },
                      {
                        name: "x86_64 (Emulators)",
                        url: ("https://github.com/DragonEmperor9480/aws-manager/releases/download/" + $tag + "/aws-manager-" + $tag + "-x86_64.apk")
                      }
                    ]
                  },
                  linux: {
                    version: $version,
                    status: "available",
                    downloadUrl: ("https://github.com/DragonEmperor9480/aws-manager/releases/tag/" + $tag),
                    files: [
                      {
                        name: "AppImage",
                        url: ("https://github.com/DragonEmperor9480/aws-manager/releases/download/" + $tag + "/aws-manager-" + $version + "-x86_64.AppImage")
                      },
                      {
                        name: "DEB",
                        url: ("https://github.com/DragonEmperor9480/aws-manager/releases/download/" + $tag + "/aws-manager_0.0.0-" + ($version | gsub(" "; "-")) + "_amd64.deb")
                      }
                    ]
                  },
                  windows: {
                    version: $version,
                    status: "available",
                    downloadUrl: ("https://github.com/DragonEmperor9480/aws-manager/releases/download/" + $tag + "/aws-manager-setup-" + $version + ".exe"),
                    files: [
                      {
                        name: "Installer (.exe)",
                        url: ("https://github.com/DragonEmperor9480/aws-manager/releases/download/" + $tag + "/aws-manager-setup-" + $version + ".exe")
                      }
                    ]
                  },
                  macos: {
                    version: $version,
                    status: "coming-soon",
                    downloadUrl: null,
                    files: []
                  }
                }
              }' > new_release.json

        - name: Append release to website version.json
          run: |
            cd terminal-aws-commander/src/data
            jq '. |= [input] + .' version.json ../../../new_release.json > tmp.json
            mv tmp.json version.json

        - name: Commit and push website update
          run: |
            cd terminal-aws-commander

            git config user.name "DragonEmperor9480"
            git config user.email "amruteshnaregal1234@gmail.com"

            git add src/data/version.json
            git commit -m "github-actions: chore: add $RELEASE_VERSION release"
            git push




