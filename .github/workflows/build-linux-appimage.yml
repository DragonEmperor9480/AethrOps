name: AethrOps Linux AppImage

on:
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest
    if: success()

    env:
      APP_NAME: AethrOps

    steps:
      - uses: actions/checkout@v4

      - name: Ensure jq is installed
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Read version from version.json
        id: version
        run: |
          # Read version and normalize (lowercase + spaces to dashes)
          VERSION=$(jq -r '.linux.version' version.json | tr '[:upper:]' '[:lower:]' | tr ' ' '-')
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: oracle

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev libblkid-dev liblzma-dev \
            libjsoncpp-dev libsecret-1-dev \
            wget

      - name: Build backend
        run: |
          cd backend
          GOOS=linux GOARCH=amd64 go build -o aethrops_core main.go

      - name: Build Flutter Linux app
        working-directory: awsmgr_ui
        run: |
          flutter pub get
          flutter build linux --release

      - name: Prepare AppDir
        run: |
          set -e

          PROJECT_ROOT="$GITHUB_WORKSPACE"
          APPDIR="$PROJECT_ROOT/build/appimage/aethrops.AppDir"
          RELEASE_DIR="$PROJECT_ROOT/release/linux"

          rm -rf "$PROJECT_ROOT/build/appimage"
          mkdir -p "$APPDIR" "$RELEASE_DIR"

          cp -r awsmgr_ui/build/linux/x64/release/bundle/* "$APPDIR/"
          cp backend/aethrops_core "$APPDIR/"
          chmod +x "$APPDIR/aethrops_core"
          mv "$APPDIR/aethrops" "$APPDIR/aethrops"

      - name: Create AppRun
        run: |
          cat > build/appimage/aethrops.AppDir/AppRun << 'EOF'
          #!/bin/bash
          APPDIR="$(dirname "$(readlink -f "$0")")"
          export LD_LIBRARY_PATH="$APPDIR/lib:$LD_LIBRARY_PATH"
          cd "$APPDIR"
          ./aethrops_core &
          exec "$APPDIR/aethrops" "$@"
          EOF
          chmod +x build/appimage/aethrops.AppDir/AppRun

      - name: Create desktop file
        run: |
          cat > build/appimage/aethrops.AppDir/aethrops.desktop << EOF
          [Desktop Entry]
          Name=AethrOps
          Exec=aethrops
          Icon=aethrops
          Type=Application
          Categories=Development;
          EOF
          chmod +x build/appimage/aethrops.AppDir/aethrops.desktop

      - name: Setup icon
        run: |
          cp awsmgr_ui/linux/icon.png build/appimage/aethrops.AppDir/aethrops.png
          ln -sf aethrops.png build/appimage/aethrops.AppDir/.DirIcon

      - name: Download appimagetool
        run: |
          mkdir -p build/appimage
          wget -q -O build/appimage/appimagetool.AppImage \
            https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x build/appimage/appimagetool.AppImage

      - name: Build AppImage
        run: |
          cd build/appimage
          export ARCH=x86_64
          ./appimagetool.AppImage \
            --appimage-extract-and-run \
            aethrops.AppDir \
            AethrOps-${VERSION}-x86_64.AppImage

          mv AethrOps-${VERSION}-x86_64.AppImage \
            "$GITHUB_WORKSPACE/release/linux/"

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: AethrOps-linux-appimage
          path: release/linux/*.AppImage
